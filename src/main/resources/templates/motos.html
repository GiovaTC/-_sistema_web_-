<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Listado de Motos</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand"
           href="/">
            🏍️ Tienda de Motos
        </a>
        <a href="/"
           class="btn btn-outline-light">
            Inicio
        </a>
    </div>
</nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>
            Listado de Motos
        </h1>
        <a href="/motos/nuevo"
           class="btn btn-success">
            + Nueva Moto
        </a>
    </div>
    <!-- BUSCADOR -->
    <form action="/motos"
          method="get"
          class="row g-2 mb-4">
        <div class="col-md-8">
            <input
                    type="text"
                    name="marca"
                    class="form-control"
                    placeholder="Buscar por marca"
                    th:value="${marcaBusqueda}">
        </div>
        <div class="col-md-2">
            <button
                    type="submit"
                    class="btn btn-primary w-100">
                Buscar
            </button>
        </div>
        <div class="col-md-2">
            <a
                    href="/motos"
                    class="btn btn-secondary w-100">
                Limpiar
            </a>
        </div>
    </form>
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Año</th>
                <th>Cilindraje</th>
                <th>Color</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="moto : ${motos}">
                <td th:text="${moto.id}">
                    1
                </td>
                <td th:text="${moto.marca}">
                    Yamaha
                </td>
                <td th:text="${moto.modelo}">
                    MT-03
                </td>
                <td th:text="${moto.anio}">
                    2025
                </td>
                <td>
                    <span th:text="${moto.cilindraje}">
                        321
                    </span>
                    cc
                </td>
                <td th:text="${moto.color}">
                    Negro
                </td>
                <td>
                    $ <span
                        th:text="${#numbers.formatDecimal(
                        moto.precio,
                        0,
                        'COMMA',
                        2,
                        'POINT')}">
                        28,500,000.00
                    </span>
                </td>
                <td>
                    <a
                            th:href="@{/motos/detalle/{id}(id=${moto.id})}"
                            class="btn btn-info btn-sm">
                        Ver
                    </a>
                    <a
                            th:href="@{/motos/editar/{id}(id=${moto.id})}"
                            class="btn btn-warning btn-sm">
                        Editar
                    </a>
                    <a
                            th:href="@{/motos/eliminar/{id}(id=${moto.id})}"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('¿Desea eliminar esta moto?');">
                        Eliminar
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(motos)}">
                <td
                        colspan="8"
                        class="text-center">
                    No existen motos registradas.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
